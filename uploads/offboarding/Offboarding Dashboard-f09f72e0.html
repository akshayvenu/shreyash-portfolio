<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Offboarding Dashboard · AIVision HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: 'Poppins', system-ui, sans-serif;
    color: #0F172A;
    background: #0F172A;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ── PAGE SHELL ───────────────────────────────────────── */
  .shell{
    position: relative;
    display: flex;
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    background: linear-gradient(145deg, #0F172A 0%, #1E293B 55%, #2D1010 100%);
    overflow: hidden;
  }
  .shell::before{
    /* dot grid overlay */
    content:"";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 0 0;
    pointer-events: none;
    z-index: 0;
  }
  .shell::after{
    /* decorative red circle top right */
    content:"";
    position: absolute;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(189,19,19,0.05);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }
  .deco-glow{
    position:absolute; left: -120px; bottom: -160px;
    width: 420px; height: 420px; border-radius:50%;
    background: radial-gradient(circle, rgba(189,19,19,0.10), transparent 60%);
    pointer-events: none; z-index:0;
  }

  /* ── SIDEBAR ──────────────────────────────────────────── */
  .sidebar{
    position: relative;
    z-index: 2;
    width: 240px;
    flex-shrink: 0;
    height: 100vh;
    background: rgba(255,255,255,0.04);
    border-right: 1px solid rgba(255,255,255,0.07);
    display: flex; flex-direction: column;
    padding: 24px 0;
    backdrop-filter: blur(8px);
  }
  .sb-brand{ padding: 0 24px; }
  .sb-brand img{ height: 28px; display: block; }
  .sb-brand .sub{
    font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin-top: 8px; letter-spacing: 0.2px;
  }
  .sb-div{
    height:1px;
    background: rgba(255,255,255,0.07);
    margin: 20px 0;
  }
  .sb-label{
    padding: 0 24px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .sb-nav{ display: flex; flex-direction: column; }
  .sb-item{
    display: flex; align-items: center;
    height: 40px; padding: 0 24px;
    color: rgba(255,255,255,0.45);
    font-size: 13px; font-weight: 400;
    cursor: pointer;
    border-left: 3px solid transparent;
    margin-left: 0;
    transition: background 150ms ease, color 150ms ease;
    user-select: none;
  }
  .sb-item svg{ width:16px; height:16px; margin-right:10px; flex-shrink:0; }
  .sb-item:hover{ background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); }
  .sb-item.active{
    background: rgba(189,19,19,0.15);
    border-left-color: #BD1313;
    color: white;
    font-weight: 500;
  }
  .sb-bottom{ margin-top: auto; padding: 16px 24px 0; }
  .sb-bottom .sb-div{ margin: 0 0 16px; }
  .sb-me{ display: flex; align-items: center; }
  .sb-avatar{
    width:36px; height:36px; border-radius:50%;
    background: #BD1313; color: white;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sb-me .info{ margin-left: 10px; flex: 1; min-width: 0; }
  .sb-me .name{ font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); line-height: 1.1; }
  .sb-me .role{ font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }
  .sb-logout{
    background: none; border: 0; padding: 6px;
    color: rgba(255,255,255,0.3); cursor: pointer;
    display: flex; align-items: center;
    transition: color 150ms;
  }
  .sb-logout:hover{ color: #FECACA; }

  /* ── MAIN ─────────────────────────────────────────────── */
  .main{
    position: relative;
    z-index: 1;
    flex: 1;
    height: 100vh;
    overflow-y: auto;
    padding: 32px 40px 56px;
  }
  .main::-webkit-scrollbar{ width: 10px; }
  .main::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.08); border-radius:10px; }
  .main::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,0.18); }

  /* Top bar */
  .topbar{
    display:flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 28px;
  }
  .topbar h1{
    margin:0;
    font-size: 22px; font-weight: 700;
    color: white;
    letter-spacing: -0.2px;
  }
  .topbar .sub{
    color: rgba(255,255,255,0.45);
    font-size: 13px;
    margin-top: 4px;
  }
  .btn-primary{
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 20px;
    background: #BD1313; color: white;
    border: 0; border-radius: 10px;
    font: 600 14px 'Poppins', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(189,19,19,0.30);
    transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
  }
  .btn-primary:hover{ background:#991010; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(189,19,19,0.35); }
  .btn-primary:active{ transform: translateY(0); }
  .btn-primary svg{ width:16px; height:16px; }

  /* KPI row */
  .kpi-row{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 14px;
  }
  .kpi{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px 24px;
    transition: background 200ms, border-color 200ms, transform 200ms;
  }
  .kpi:hover{ background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.14); transform: translateY(-1px); }
  .kpi-label{
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase; letter-spacing: 0.6px;
    margin-bottom: 10px;
  }
  .kpi-value{ font-size: 28px; font-weight: 700; color: white; line-height: 1; }
  .kpi-sub{
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: rgba(255,255,255,0.45);
    margin-top: 8px;
  }
  .dot{ width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* metric chips */
  .chips-row{
    display: flex; gap: 12px;
    margin-bottom: 28px;
  }
  .chip{
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 20px;
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
  }
  .chip strong{ color: rgba(255,255,255,0.85); font-weight: 600; margin-left: 4px; }
  .chip svg{ width:14px; height:14px; flex-shrink:0; }

  /* ── TABLE CARD ───────────────────────────────────────── */
  .card{
    background: white;
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    overflow: hidden;
  }
  .card-head{
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid #E2E8F0;
  }
  .card-title{ font-size: 16px; font-weight: 600; color: #0F172A; margin: 0; }
  .card-sub{ font-size: 13px; color: #64748B; margin-top: 2px; }
  .card-head .actions{ display: flex; gap: 10px; align-items: center; }

  .search-input{
    position: relative;
    width: 220px; height: 36px;
  }
  .search-input input{
    width: 100%; height: 100%;
    border: 1.5px solid #E2E8F0;
    border-radius: 8px;
    padding: 0 12px 0 34px;
    font: 400 13px 'Poppins', sans-serif;
    color: #0F172A;
    background: white;
    outline: none;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .search-input input::placeholder{ color: #94A3B8; }
  .search-input input:focus{
    border-color: #BD1313;
    box-shadow: 0 0 0 3px rgba(189,19,19,0.10);
  }
  .search-input svg{
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: #94A3B8; pointer-events: none;
  }

  .select{
    position: relative;
    height: 36px;
  }
  .select-trigger{
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px;
    border: 1.5px solid #E2E8F0;
    background: white;
    border-radius: 8px;
    font: 500 13px 'Poppins'; color: #475569;
    cursor: pointer;
  }
  .select-trigger:hover{ border-color: #CBD5E1; }
  .select-menu{
    position: absolute; right: 0; top: calc(100% + 6px);
    min-width: 160px;
    background: white;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.10);
    padding: 6px; z-index: 5;
  }
  .select-item{
    padding: 8px 10px; border-radius: 6px;
    font: 500 13px 'Poppins'; color: #475569;
    cursor: pointer;
  }
  .select-item:hover{ background: #F8FAFC; }
  .select-item.active{ background: #FDF2F2; color: #BD1313; }

  /* Table */
  table.cases{
    width: 100%;
    border-collapse: collapse;
  }
  table.cases thead th{
    background: #FAFAFA;
    border-bottom: 2px solid #E2E8F0;
    padding: 12px 20px;
    font: 600 11px 'Poppins';
    text-transform: uppercase;
    color: #94A3B8;
    letter-spacing: 0.6px;
    text-align: left;
    white-space: nowrap;
  }
  table.cases tbody td{
    padding: 14px 20px;
    border-bottom: 1px solid #E2E8F0;
    vertical-align: middle;
    font-size: 12px;
    color: #475569;
  }
  table.cases tbody tr{
    cursor: pointer;
    transition: background 150ms;
  }
  table.cases tbody tr:hover{ background: #FFFBFB; }
  table.cases tbody tr:last-child td{ border-bottom: 0; }

  .emp{ display: flex; align-items: center; gap: 12px; min-width: 0; }
  .av{
    width: 36px; height: 36px; border-radius: 50%;
    color: white; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .emp .name{ font-size: 13px; font-weight: 600; color: #0F172A; line-height: 1.15; }
  .emp .desig{ font-size: 11px; color: #64748B; margin-top: 1px; }
  .emp .eid{ font-size: 11px; color: #94A3B8; margin-top: 2px; }

  .pill{
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .progress{
    width: 80px; height: 6px; background: #F1F5F9;
    border-radius: 999px; overflow: hidden;
    display: inline-block; vertical-align: middle;
  }
  .progress > i{ display:block; height: 100%; border-radius: 999px; transition: width 400ms ease; }
  .progress-row{ display: inline-flex; align-items: center; gap: 8px; }
  .progress-label{ font-size: 11px; color: #64748B; }

  .day-chip{
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.2px;
  }

  .view-btn{
    height: 32px; padding: 0 12px;
    border: 1.5px solid #E2E8F0;
    background: white;
    border-radius: 8px;
    font: 600 12px 'Poppins';
    color: #475569;
    cursor: pointer;
    transition: all 150ms;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .view-btn:hover{
    background: #FDF2F2;
    border-color: #F5BFBF;
    color: #BD1313;
  }

  /* ── MODAL ─────────────────────────────────────────────── */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 200ms ease both;
    padding: 20px;
  }
  .modal{
    width: 480px; max-width: 100%;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.28);
    padding: 32px;
    animation: scaleIn 300ms cubic-bezier(.2,.9,.2,1) both;
  }
  .modal-illu{
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    background: linear-gradient(135deg, #FEF2F2, #FDF2F2);
    border: 1px solid #F5BFBF;
    color: #BD1313;
  }
  .modal h2{
    margin: 0;
    text-align: center;
    font-size: 18px; font-weight: 600; color: #0F172A;
  }
  .modal .desc{
    text-align: center;
    margin-top: 6px;
    font-size: 13px; color: #64748B;
  }
  .field{ margin-top: 20px; }
  .field-label{
    font-size: 11px; font-weight: 600;
    text-transform: uppercase;
    color: #94A3B8;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }
  .input{
    position: relative;
  }
  .input input{
    width: 100%;
    height: 48px;
    padding: 0 14px 0 42px;
    border: 1.5px solid #E2E8F0;
    border-radius: 10px;
    font: 400 13px 'Poppins'; color: #0F172A;
    outline: none;
    transition: border-color 150ms, box-shadow 150ms;
    background: white;
  }
  .input input::placeholder{ color: #94A3B8; }
  .input input:focus{
    border-color: #BD1313;
    box-shadow: 0 0 0 3px rgba(189,19,19,0.10);
  }
  .input > svg.lead{
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px; color: #94A3B8;
    pointer-events: none;
  }

  .results{
    margin-top: 4px;
    background: white;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    max-height: 200px;
    overflow-y: auto;
    animation: fadeIn 150ms;
  }
  .result-row{
    display: flex; align-items: center;
    height: 52px; padding: 0 16px;
    cursor: pointer;
    gap: 10px;
    border-bottom: 1px solid #F1F5F9;
  }
  .result-row:last-child{ border-bottom: 0; }
  .result-row:hover{ background: #F8FAFC; }
  .result-row .name{ font-size: 13px; font-weight: 600; color: #0F172A; line-height: 1.15; }
  .result-row .desig{ font-size: 11px; color: #64748B; margin-top:1px; }
  .av-sm{ width: 32px; height: 32px; font-size: 11px; }
  .dept-chip{
    margin-left: auto;
    background: #F1F5F9;
    color: #475569;
    font: 600 11px 'Poppins';
    padding: 3px 10px;
    border-radius: 999px;
  }

  .selected-emp{
    margin-top: 16px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .selected-emp .av{ width: 40px; height: 40px; font-size: 13px; }
  .selected-emp .name{ font-size: 13px; font-weight: 600; color: #0F172A; line-height: 1.15; }
  .selected-emp .desig{ font-size: 11px; color: #64748B; margin-top: 2px; }
  .selected-emp .eid{ font-size: 11px; color: #94A3B8; }
  .selected-emp .check{
    margin-left: auto;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #DCFCE7;
    color: #16A34A;
    display: flex; align-items: center; justify-content: center;
  }

  /* Exit type grid */
  .exit-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .exit-opt{
    position: relative;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid #E2E8F0;
    background: white;
    cursor: pointer;
    transition: all 200ms ease;
    display: flex; flex-direction: column; gap: 4px;
  }
  .exit-opt:hover{ border-color: #CBD5E1; background: #FAFAFA; }
  .exit-opt .head{ display: flex; align-items: center; gap: 8px; }
  .exit-opt .opt-dot{ width: 10px; height: 10px; border-radius: 50%; }
  .exit-opt .label{ font: 600 13px 'Poppins'; color: #0F172A; }
  .exit-opt .desc{ font-size: 11px; color: #94A3B8; }
  .exit-opt .check{
    position: absolute; top: 8px; right: 8px;
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.6);
    transition: opacity 200ms, transform 200ms;
  }
  .exit-opt.selected .check{ opacity: 1; transform: scale(1); }

  /* Warning */
  .warning{
    margin-top: 16px;
    background: #FEF3C7;
    border: 1px solid #FCD34D;
    border-radius: 10px;
    padding: 12px 16px;
    display: flex; gap: 10px;
    font-size: 12px;
    color: #92400E;
    line-height: 1.5;
  }
  .warning svg{ flex-shrink: 0; color: #D97706; margin-top: 1px; }

  /* Modal footer */
  .modal-foot{
    margin-top: 24px;
    display: flex; gap: 10px;
  }
  .btn{
    flex: 1; height: 44px;
    border-radius: 10px;
    font: 600 13px 'Poppins';
    cursor: pointer;
    transition: all 180ms ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-ghost{
    background: white;
    border: 1.5px solid #E2E8F0;
    color: #475569;
  }
  .btn-ghost:hover{ background: #F8FAFC; border-color: #CBD5E1; }
  .btn-cta{
    background: #BD1313;
    border: 0; color: white;
    box-shadow: 0 4px 12px rgba(189,19,19,0.30);
  }
  .btn-cta:hover{ background: #991010; }
  .btn-cta[disabled]{
    background: #F5BFBF;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* Toast */
  .toast{
    position: fixed;
    left: 50%; bottom: 32px;
    transform: translateX(-50%);
    background: #0F172A;
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 18px;
    font: 500 13px 'Poppins';
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    display: flex; align-items: center; gap: 10px;
    z-index: 100;
    animation: toastIn 300ms ease, toastOut 300ms ease 2700ms forwards;
  }
  .toast .ok{ color: #86EFAC; }

  /* Animations */
  @keyframes fadeIn{ from{ opacity: 0 } to{ opacity: 1 } }
  @keyframes scaleIn{
    from{ opacity: 0; transform: scale(.94) translateY(8px); }
    to{ opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes toastIn{
    from{ opacity:0; transform: translate(-50%, 12px); }
    to{ opacity:1; transform: translate(-50%, 0); }
  }
  @keyframes toastOut{
    to{ opacity: 0; transform: translate(-50%, 8px); }
  }

  .anim-fadeup{ animation: fadeUp 300ms ease both; }
  .anim-scalein{ animation: scaleIn 350ms cubic-bezier(.2,.9,.2,1) both; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ── ICONS ──────────────────────────────────────────────── */
const Icon = {
  grid: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>,

/* ── KPI ROW ────────────────────────────────────────────── */
function KpiRow() {
  const kpis = [
    { label: 'Active Cases',         value: 4, sub: 'Currently in pipeline', dot: '#FFFFFF' },
    { label: 'Pending Clearance',    value: 2, sub: 'Needs attention',       dot: '#D97706' },
    { label: 'Awaiting Settlement',  value: 1, sub: 'F&F pending',           dot: '#3B82F6' },
    { label: 'Completed This Month', value: 2, sub: 'Successfully closed',   dot: '#16A34A' },
  ];
  return (
    <div className="kpi-row">
      {kpis.map((k,i) => (
        <div key={k.label} className="kpi anim-scalein" style={{ animationDelay: `${i*60}ms` }}>
          <div className="kpi-label">{k.label}</div>
          <div className="kpi-value">{k.value}</div>
          <div className="kpi-sub"><span className="dot" style={{ background: k.dot }}/> {k.sub}</div>
        </div>
      ))}
    </div>

}

/* ── TABLE ──────────────────────────────────────────────── */
function CasesTable({ onOpenInitiate }) {
  const [q, setQ] = useState('');
  const [phaseFilter, setPhaseFilter] = useState('All Phases');
  const [openSel, setOpenSel] = useState(false);
  const selRef = useRef(null);

  useEffect(() => {
    const h = (e) => { if (selRef.current && !selRef.current.contains(e.target)) setOpenSel(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const phaseOptions = ['All Phases', ...Object.keys(PHASES)];

  const rows = useMemo(() => EMPLOYEES.filter(r => {
    if (q.trim()){
      const t = q.toLowerCase();
      if (!(r.name.toLowerCase().includes(t) || r.id.toLowerCase().includes(t) || r.dept.toLowerCase().includes(t))) return false;
    }
    if (phaseFilter !== 'All Phases' && r.phase !== phaseFilter) return false;
    return true;
  }), [q, phaseFilter]);

  return (
    <div className="card anim-scalein" style={{ animationDelay:'200ms' }}>
      <div className="card-head">
        <div>
          <h2 className="card-title">Active Offboarding Cases</h2>
          <div className="card-sub">4 employees in exit pipeline</div>
        </div>
        <div className="actions">
          <div className="search-input">
            <Icon.search />
            <input placeholder="Search employees…" value={q} onChange={e=>setQ(e.target.value)} />
          </div>
          <div className="select" ref={selRef}>
            <div className="select-trigger" onClick={()=>setOpenSel(v=>!v)}>
              <Icon.filter />
              <span>{phaseFilter}</span>
              <Icon.chevron />
            </div>
            {openSel && (
              <div className="select-menu">
                {phaseOptions.map(p => (
                  <div key={p}
                       className={'select-item ' + (p===phaseFilter ? 'active':'')}
                       onClick={()=>{ setPhaseFilter(p); setOpenSel(false); }}>
                    {p}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>

      <table className="cases">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Department</th>
            <th>Exit Type</th>
            <th>Phase</th>
            <th>Clearance</th>
            <th>Last Working Day</th>
            <th style={{ textAlign:'right' }}>Action</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(r => {
            const exit = EXIT_TYPES[r.exitType] || EXIT_TYPES['Resignation'];
            const phase = PHASES[r.phase];
            const fillColor = r.clearance === 100 ? '#16A34A' : phase.fill;
            // day chip
            let chip = null;
            if (r.phase === 'Phase 5 Completed') {
              chip = <span className="pill" style={{ background:'#DCFCE7', color:'#16A34A', borderColor:'#86EFAC', fontSize:'10px' }}>Completed</span>;
            } else if (r.daysLeft === 0) {
              chip = <span className="day-chip" style={{ background:'#FEF2F2', color:'#DC2626' }}>Today</span>;
            } else if (r.daysLeft <= 7) {
              chip = <span className="day-chip" style={{ background:'#FEF3C7', color:'#D97706' }}>{r.daysLeft} days</span>;
            } else {
              chip = <span className="day-chip" style={{ background:'#F1F5F9', color:'#64748B', fontWeight: 500 }}>{r.daysLeft} days</span>;
            }
            return (
              <tr key={r.id}>
                <td>
                  <div className="emp">
                    <div className="av" style={{ background: r.color }}>{r.initials}</div>
                    <div>
                      <div className="name">{r.name}</div>
                      <div className="desig">{r.desig}</div>
                      <div className="eid mono">{r.id}</div>
                    </div>
                  </div>
                </td>
                <td>{r.dept}</td>
                <td>
                  <span className="pill" style={{ background: exit.bg, color: exit.fg, borderColor: exit.bd }}>
                    {r.exitType}
                  </span>
                </td>
                <td>
                  <span className="pill" style={{ background: phase.bg, color: phase.fg, borderColor: phase.bd }}>
                    {r.phase}
                  </span>
                </td>
                <td>
                  <div className="progress-row">
                    <span className="progress"><i style={{ width: `${r.clearance}%`, background: fillColor }} /></span>
                    <span className="progress-label">{r.clearance}%</span>
                  </div>
                </td>
                <td>
                  <div style={{ fontSize:'12px', color:'#64748B' }}>{r.lastDay}</div>
                  {chip}
                </td>
                <td style={{ textAlign:'right' }}>
                  <button className="view-btn">View <Icon.arrow /></button>
                </td>
              </tr>
            );
          })}
          {rows.length === 0 && (
            <tr><td colSpan="7" style={{ textAlign:'center', padding:'40px', color:'#94A3B8' }}>No cases match your filters.</td></tr>
          )}
        </tbody>
      </table>
    </div>
  );
}

/* ── INITIATE EXIT MODAL ────────────────────────────────── */
function InitiateModal({ onClose, onSuccess }) {
  const [query, setQuery] = useState('');
  const [selected, setSelected] = useState(null);
  const [exitType, setExitType] = useState(null);
  const [lastDate, setLastDate] = useState('');

  const results = useMemo(() => {
    if (query.trim().length < 2) return [];
    const t = query.toLowerCase();
    // demo: include a couple of non-offboarding candidates to feel real
    const pool = [
      ...EMPLOYEES.filter(e => e.phase !== 'Phase 5 Completed'),
      { id: 'AIV-2023-0044', name: 'Priyanka Reddy', initials: 'PR', color:'#0EA5E9', desig: 'QA Engineer', dept: 'Engineering' },
      { id: 'AIV-2024-0156', name: 'Arjun Verma', initials: 'AV', color:'#EA580C', desig: 'Account Manager', dept: 'Sales' },
    ];
    return pool.filter(e => e.name.toLowerCase().includes(t) || e.id.toLowerCase().includes(t) || (e.email||'').toLowerCase().includes(t)).slice(0, 6);
  }, [query]);

  const showResults = query.trim().length >= 2 && !selected;

  // pre-select handling: if user types "priya" and not selected, we let them click. spec asks to "pre-fill priya data" — we satisfy by showing her at top of results.
  // and once selected — set defaults for her.
  useEffect(() => {
    if (selected && selected.name === 'Priya Malhotra') {
      setExitType(prev => prev || 'Resignation');
      setLastDate(prev => prev || '2025-05-31');
    }
  }, [selected]);

  const canProceed = !!(selected && exitType && lastDate);

  return (
    <div className="overlay" onMouseDown={(e)=>{ if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" role="dialog" aria-modal="true">
        <div className="modal-illu"><Icon.exit /></div>
        <h2>Initiate Employee Exit</h2>
        <div className="desc">Search for the employee to begin the exit process</div>

        <div className="field">
          <div className="field-label">Employee Name or ID</div>
          <div className="input">
            <Icon.search className="lead" />
            <input
              placeholder="Search by name, employee ID, or email…"
              value={query}
              onChange={(e)=>{ setQuery(e.target.value); if (selected) setSelected(null); }}
              autoFocus
            />
          </div>

          {showResults && results.length > 0 && (
            <div className="results">
              {results.map(r => (
                <div key={r.id} className="result-row" onClick={()=>{ setSelected(r); setQuery(r.name); }}>
                  <div className="av av-sm" style={{ background: r.color }}>{r.initials}</div>
                  <div>
                    <div className="name">{r.name}</div>
                    <div className="desig">{r.desig}</div>
                  </div>
                  <span className="dept-chip">{r.dept}</span>
                </div>
              ))}
            </div>
          )}
          {showResults && results.length === 0 && (
            <div className="results">
              <div style={{ padding:'18px', textAlign:'center', color:'#94A3B8', fontSize:'13px' }}>
                No matching employees.
              </div>
            </div>
          )}
        </div>

        {selected && (
          <div className="selected-emp">
            <div className="av" style={{ background: selected.color }}>{selected.initials}</div>
            <div>
              <div className="name">{selected.name}</div>
              <div className="desig">{selected.desig} <span className="mono" style={{ color:'#94A3B8' }}>· {selected.id}</span></div>
            </div>
            <span className="dept-chip" style={{ marginLeft:'auto', marginRight:'10px' }}>{selected.dept}</span>
            <div className="check"><Icon.check /></div>
          </div>
        )}

        <div className="field">
          <div className="field-label">Exit Type</div>
          <div className="exit-grid">
            {['Resignation','Termination','Contract End','Retirement'].map(t => {
              const conf = EXIT_TYPES[t];
              const sel = exitType === t;
              return (
                <div key={t}
                     className={'exit-opt ' + (sel ? 'selected':'')}
                     onClick={()=> setExitType(t)}
                     style={ sel ? { borderColor: conf.bd, background: conf.bg } : null }>
                  <div className="head">
                    <span className="opt-dot" style={{ background: conf.dot }} />
                    <span className="label" style={ sel ? { color: conf.fg } : null }>{t}</span>
                  </div>
                  <div className="desc">{conf.desc}</div>
                  <div className="check" style={{ background: conf.fg, color: 'white' }}><Icon.check /></div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="field">
          <div className="field-label">Last Working Date</div>
          <div className="input">
            <Icon.cal className="lead" />
            <input type="date" value={lastDate} onChange={e=>setLastDate(e.target.value)} />
          </div>
        </div>

        <div className="warning">
          <Icon.warn />
          <div>
            This action will notify all department heads and begin the formal exit process. This cannot be undone.
          </div>
        </div>

        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-cta" disabled={!canProceed} onClick={()=> canProceed && onSuccess(selected)}>
            Proceed to Exit Form <Icon.arrow />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── APP ────────────────────────────────────────────────── */
function App(){
  const [active, setActive] = useState('dashboard');
  const [modal, setModal] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape' && modal) setModal(false); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [modal]);

  return (
    <div className="shell">
      <div className="deco-glow" />
      <Sidebar active={active} setActive={setActive} />

      <main className="main">
        <div className="topbar anim-fadeup">
          <div>
            <h1>Offboarding Dashboard</h1>
            <div className="sub">May 2025 · 4 active cases</div>
          </div>
          <button className="btn-primary" onClick={()=>setModal(true)}>
            <Icon.plus /> Initiate Exit
          </button>
        </div>

        <KpiRow />

        <div className="chips-row">
          <div className="chip">
            <Icon.clock style={{ width:14, height:14, color:'rgba(255,255,255,0.5)' }} />
            Avg. Exit Duration:<strong>28 days</strong>
          </div>
          <div className="chip">
            <span className="dot" style={{ background:'#DC2626' }} />
            Overdue Items:<strong style={{ color:'#FECACA' }}>1</strong>
          </div>
        </div>

        <CasesTable onOpenInitiate={() => setModal(true)} />
      </main>

      {modal && (
        <InitiateModal
          onClose={()=>setModal(false)}
          onSuccess={(emp)=>{
            setModal(false);
            setToast(`Exit initiated for ${emp.name}. Proceeding to exit form…`);
            setTimeout(()=>setToast(null), 3000);
          }}
        />
      )}

      {toast && (
        <div className="toast">
          <span className="ok"><Icon.check /></span>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
