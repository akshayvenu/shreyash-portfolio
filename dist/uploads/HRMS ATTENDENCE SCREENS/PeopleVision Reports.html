<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PeopleVision Reports — AIVision21</title>
<meta name="viewport" content="width=1280" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { margin:0; padding:0; height:100%; width:100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F1F5F9; color:#0F172A;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: 'Poppins', sans-serif; }

  @keyframes screenEnter {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.95); }
  }
  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(22,163,74,0); }
  }
  @keyframes toastEnter {
    from { opacity: 0; transform: translateX(-50%) translateY(-30px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .screen-enter { animation: screenEnter 280ms ease-out both; }

  .inner-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
  .inner-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .inner-scroll::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  .inner-scroll::-webkit-scrollbar-track { background: transparent; }

  /* dark sidebar scrollbar */
  aside .inner-scroll { scrollbar-color: #1E293B transparent; }
  aside .inner-scroll::-webkit-scrollbar-thumb { background: #1E293B; }

  select:focus { border-color: #BD1313; box-shadow: 0 0 0 3px rgba(189,19,19,0.10); }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid #BD1313; outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="topbar.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="hierarchy.jsx"></script>
<script type="text/babel" src="location-outdoor.jsx"></script>
<script type="text/babel" src="attendance-data.jsx"></script>
<script type="text/babel" src="attendance-screens.jsx"></script>
<script type="text/babel" src="detail-panel.jsx"></script>
<script type="text/babel" src="trends-live-export.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
