<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#6666C6"/><g transform="translate(50,50)"><circle r="21" fill="#fff" opacity="0.18"/><text x="0" y="11" font-family="Georgia,serif" font-size="30" fill="#fff" text-anchor="middle">NS</text></g></svg>
</template>
<x-dc>
<helmet>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#F1EFF8; }
    @keyframes screenEnter { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  </style>
</helmet>
<div key="{{ screenKey }}" style="min-height:100vh;">
  <sc-if value="{{ isOnboarding }}" hint-placeholder-val="{{ true }}">
    <dc-import name="NurtureSync Onboarding" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NurtureSync Home" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isLog }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NurtureSync Log" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isCope }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NurtureSync Cope" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isCalendar }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NurtureSync Calendar" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isInsights }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NurtureSync Insights" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isPrivacy }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NurtureSync Privacy" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isMe }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NurtureSync Me" on-navigate="{{ navigate }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { screen:'onboarding' };
  renderVals(){
    const s=this.state.screen;
    return {
      screenKey:s,
      navigate:(to)=>this.setState({ screen:to }),
      isOnboarding: s==='onboarding'||s==='splash',
      isHome:s==='home', isLog:s==='log', isCope:s==='cope', isCalendar:s==='calendar',
      isInsights:s==='insights', isPrivacy:s==='privacy', isMe:s==='me',
    };
  }
}
</script>
</body>
</html>
