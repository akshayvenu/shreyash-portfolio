<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Offboarding Flow · AIVision HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* ── Base ── */
  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: 'Poppins', system-ui, sans-serif;
    color: #0F172A;
    background: #0F172A;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body.dash-mode{ overflow: hidden; }
  body:not(.dash-mode){ overflow: auto; }

  #root{ min-height: 100vh; }
  .screen-root{
    min-height: 100vh;
    animation: screenFade 320ms cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes screenFade{
    from{ opacity: 0; transform: translateY(6px); }
    to  { opacity: 1; transform: translateY(0); }
  }

  /* ── Flow Map (floating helper) ── */
  .flowmap{
    position: fixed;
    right: 16px; bottom: 16px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 220px;
    background: rgba(15,23,42,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.45);
    overflow: hidden;
    color: white;
    font-family: 'Poppins', sans-serif;
    transform: translateY(0);
    transition: transform 250ms ease, opacity 250ms;
  }
  .flowmap.collapsed{ transform: translateY(calc(100% - 38px)); }
  .fm-head{
    padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    user-select: none;
  }
  .fm-head .ttl{ font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: rgba(255,255,255,0.7); }
  .fm-head .caret{ color: rgba(255,255,255,0.5); transition: transform 200ms; }
  .flowmap.collapsed .fm-head .caret{ transform: rotate(180deg); }
  .fm-body{ padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .fm-item{
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: rgba(255,255,255,0.65);
    font-size: 12px; font-weight: 500;
    transition: background 150ms, color 150ms;
  }
  .fm-item:hover{ background: rgba(255,255,255,0.06); color: white; }
  .fm-item.active{ background: rgba(189,19,19,0.20); color: white; }
  .fm-item .num{
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.7);
    font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .fm-item.active .num{ background: #BD1313; color: white; }
  .fm-item .nm{ flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ext-resource hints so the bundler picks them up */
</style>

<meta name="ext-resource-dependency" content="https://i.ibb.co/s9CvkVdd/aivision21-logo.png" />

<!-- Per-screen styles (auto-generated, namespaced) -->
<link rel="stylesheet" href="screens.css" />
</head>
<body class="dash-mode">

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Each screen exports window.<Screen>Screen -->
<script type="text/babel" data-presets="react" src="dashboard.jsx"></script>
<script type="text/babel" data-presets="react" src="initiation.jsx"></script>
<script type="text/babel" data-presets="react" src="clearance.jsx"></script>
<script type="text/babel" data-presets="react" src="settlement.jsx"></script>
<script type="text/babel" data-presets="react" src="audit.jsx"></script>

<!-- Router / app shell -->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const SCREENS = [
  { id: 'dashboard',  name: 'Dashboard',          comp: 'DashboardScreen',  ns: 'scr-dash',  bodyClass: 'dash-mode' },
  { id: 'initiation', name: 'Initiation Form',    comp: 'InitiationScreen', ns: 'scr-init',  bodyClass: '' },
  { id: 'clearance',  name: 'Clearance Tracker',  comp: 'ClearanceScreen',  ns: 'scr-clear', bodyClass: '' },
  { id: 'settlement', name: 'F&F Settlement',     comp: 'SettlementScreen', ns: 'scr-set',   bodyClass: '' },
  { id: 'audit',      name: 'Completion Audit',   comp: 'AuditScreen',      ns: 'scr-audit', bodyClass: '' },
];

function getHashScreen(){
  const m = (location.hash || '').replace(/^#/, '');
  return SCREENS.find(s => s.id === m)?.id || 'dashboard';
}

function FlowMap({ current, go }){
  const [collapsed, setCollapsed] = useState(false);
  const idx = SCREENS.findIndex(s => s.id === current);
  return (
    <div className={'flowmap ' + (collapsed ? 'collapsed' : '')}>
      <div className="fm-head" onClick={()=>setCollapsed(v=>!v)}>
        <span className="ttl">Flow · {idx + 1}/{SCREENS.length}</span>
        <span className="caret">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <div className="fm-body">
        {SCREENS.map((s, i) => (
          <div key={s.id}
               className={'fm-item ' + (current === s.id ? 'active' : '')}
               onClick={()=>go(s.id)}>
            <span className="num">{i+1}</span>
            <span className="nm">{s.name}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [current, setCurrent] = useState(getHashScreen());

  const nav = useCallback((id) => {
    if (!SCREENS.find(s => s.id === id)) return;
    setCurrent(id);
    if (location.hash.replace(/^#/, '') !== id) {
      history.replaceState(null, '', '#' + id);
    }
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, []);

  useEffect(() => {
    const onHash = () => setCurrent(getHashScreen());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // toggle body class for overflow handling
  useEffect(() => {
    const s = SCREENS.find(x => x.id === current);
    document.body.classList.remove('dash-mode');
    if (s.bodyClass) document.body.classList.add(s.bodyClass);
  }, [current]);

  const s = SCREENS.find(x => x.id === current);
  const ScreenComp = window[s.comp];

  return (
    <>
      <div className={'screen-root ' + s.ns} key={current}>
        {ScreenComp ? <ScreenComp nav={nav} /> : (
          <div style={{ padding: 40, color: 'white' }}>Loading {s.name}…</div>
        )}
      </div>
      <FlowMap current={current} go={nav} />
    </>
  );
}

// Wait for all screen scripts to load — Babel scripts are async
function start(){
  if (!window.DashboardScreen || !window.InitiationScreen ||
      !window.ClearanceScreen || !window.SettlementScreen || !window.AuditScreen) {
    setTimeout(start, 30);
    return;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
start();
</script>

</body>
</html>
