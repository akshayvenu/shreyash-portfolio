<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>F&F Settlement · AIVision HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; min-height: 100%; }
  body{
    font-family: 'Poppins', system-ui, sans-serif;
    color: #0F172A;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .rupee{ font-family: 'Poppins'; font-feature-settings: 'tnum' 1; }

  /* SHELL */
  .shell{
    position: relative;
    min-height: 100vh;
    background: linear-gradient(145deg, #0F172A 0%, #1E293B 55%, #2D1010 100%);
    overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  .shell::before{
    content:""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none; z-index: 0;
  }
  .shell::after{
    content:""; position: absolute;
    top: -120px; right: -120px;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: rgba(189,19,19,0.06);
    pointer-events: none; z-index: 0;
  }
  .deco-glow{
    position:absolute; left:-140px; bottom:-180px;
    width: 460px; height: 460px; border-radius:50%;
    background: radial-gradient(circle, rgba(189,19,19,0.10), transparent 60%);
    pointer-events: none; z-index:0;
  }

  /* TOP NAV */
  .topnav{
    position: sticky; top: 0; z-index: 20;
    width: 100%; height: 56px;
    background: rgba(15,23,42,0.55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-left{ display: flex; align-items: center; gap: 14px; }
  .nav-left img{ height: 28px; display: block; }
  .nav-left .divider{ width:1px; height:20px; background: rgba(255,255,255,0.12); }
  .nav-left .title{ font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); }
  .nav-left .crumb{ color: rgba(255,255,255,0.4); font-weight: 500; margin-left: 4px; }
  .nav-right{ display: flex; align-items: center; gap: 12px; }
  .nav-right .who{ text-align: right; line-height: 1.15; }
  .nav-right .name{ font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); }
  .nav-right .role{ font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .av-rk{
    width: 34px; height: 34px; border-radius: 50%;
    background: #BD1313; color: white;
    display: flex; align-items: center; justify-content: center;
    font: 600 12px 'Poppins';
  }

  .card-wrap{
    position: relative; z-index: 1;
    width: 100%;
    display: flex; justify-content: center;
    padding: 32px 20px 56px;
  }
  .card{
    width: 100%; max-width: 900px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    overflow: hidden;
    animation: scaleIn 350ms cubic-bezier(.2,.9,.2,1) both;
  }
  .card-top{
    height: 56px;
    padding: 0 32px;
    border-bottom: 1px solid #E2E8F0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-top .l{ display: flex; align-items: center; gap: 12px; }
  .card-top .l img{ height: 24px; display: block; }
  .card-top .l .t{ font-size: 13px; font-weight: 600; color: #0F172A; }
  .card-top .r{ display: flex; align-items: center; gap: 8px; }
  .card-top .r .lbl{ font-size: 12px; color: #94A3B8; }
  .card-top .r .em{ font-size: 12px; font-weight: 600; color: #BD1313; }

  /* STEPPER */
  .stepper{
    padding: 18px 32px;
    border-bottom: 1px solid #F1F5F9;
    display: flex; align-items: flex-start;
  }
  .step{
    display: flex; flex-direction: column; align-items: center;
    flex: 0 0 auto; width: 130px; position: relative;
  }
  .step .circle{
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: 600 13px 'Poppins';
    background: #F1F5F9; border: 1px solid #E2E8F0; color: #94A3B8;
    transition: all 250ms;
    z-index: 2; position: relative;
  }
  .step.done .circle{ background: #DCFCE7; color: #16A34A; border-color: #86EFAC; }
  .step.active .circle{
    background: #BD1313; color: white; border-color: #BD1313;
    box-shadow: 0 0 0 6px rgba(189,19,19,0.18);
    animation: pulseRed 2s ease-in-out infinite;
  }
  @keyframes pulseRed{
    0%, 100% { box-shadow: 0 0 0 6px rgba(189,19,19,0.18); }
    50%      { box-shadow: 0 0 0 10px rgba(189,19,19,0.08); }
  }
  .step .lbl{
    margin-top: 8px;
    font: 500 11px 'Poppins';
    color: #94A3B8;
    text-align: center; line-height: 1.2;
  }
  .step.done .lbl{ color: #16A34A; font-weight: 600; }
  .step.active .lbl{ color: #BD1313; font-weight: 600; }
  .connector{
    flex: 1; height: 2px;
    background: #E2E8F0;
    margin-top: 15px;
    border-radius: 2px;
    min-width: 12px;
  }
  .connector.done{ background: #86EFAC; }

  /* EMPLOYEE BANNER */
  .banner-wrap{ padding: 28px 32px 0; }
  .emp-banner{
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .emp-banner .av{
    width: 48px; height: 48px; border-radius: 50%;
    background: #BD1313; color: white;
    font: 600 15px 'Poppins';
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .emp-banner .info{ flex: 1; min-width: 0; }
  .emp-banner .name{ font-size: 16px; font-weight: 600; color: #0F172A; }
  .emp-banner .desig{ font-size: 13px; color: #64748B; margin-top: 2px; }
  .emp-banner .eid{ font-size: 11px; color: #94A3B8; margin-top: 2px; }
  .emp-banner .rt{ text-align: right; flex-shrink: 0; }
  .emp-banner .rt .pill{ margin-bottom: 4px; }
  .emp-banner .rt .stamp{ font-size: 11px; color: #64748B; font-style: italic; }

  .pill{
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-size: 11px; font-weight: 600;
    white-space: nowrap;
  }

  /* SECTION */
  .body{ padding: 28px 32px 32px; }
  .sec-label{
    font-size: 11px; font-weight: 600;
    text-transform: uppercase;
    color: #94A3B8;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
  }
  .divider{ height: 1px; background: #E2E8F0; margin: 32px 0; }

  /* FINANCIAL LAYOUT */
  .fin-grid{
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    align-items: start;
  }

  .fin-block + .fin-block{ margin-top: 16px; }
  .fin-title{ font-size: 14px; font-weight: 600; color: #0F172A; margin-bottom: 12px; }
  .fin-table{
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    overflow: hidden;
  }
  table.amt{ width: 100%; border-collapse: collapse; }
  table.amt thead th{
    background: #F1F5F9;
    padding: 10px 16px;
    font: 600 11px 'Poppins';
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #94A3B8;
    text-align: left;
  }
  table.amt thead th.r{ text-align: right; }
  table.amt tbody td{
    padding: 12px 16px;
    border-bottom: 1px solid #F1F5F9;
    font-size: 13px;
    color: #475569;
  }
  table.amt tbody td.item{ color: #0F172A; font-weight: 500; }
  table.amt tbody td.calc{ color: #64748B; font-size: 12px; }
  table.amt tbody td.amount{
    text-align: right;
    color: #0F172A;
    font: 600 13px 'Poppins';
    font-variant-numeric: tabular-nums;
  }
  table.amt tbody td.muted{ color: #94A3B8; }
  table.amt tbody tr.sub td{
    border-bottom: 0;
    padding: 12px 16px;
    font-weight: 700;
    font-size: 14px;
  }
  tr.sub.earn td{ background: #DCFCE7; color: #16A34A; }
  tr.sub.ded td{ background: #FEF2F2; color: #DC2626; }

  /* Net payable card */
  .netcard{
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 20px;
    position: sticky; top: 76px;
  }
  .netcard h4{ margin: 0; font: 600 14px 'Poppins'; color: #0F172A; }
  .netcard .row{
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px;
    font-size: 13px;
  }
  .netcard .row .k{ color: #64748B; }
  .netcard .row .v{ font-weight: 600; font-variant-numeric: tabular-nums; }
  .netcard .row .v.green{ color: #16A34A; }
  .netcard .row .v.red{ color: #DC2626; }
  .netcard .nd{ height: 1px; background: #E2E8F0; margin: 14px 0; }
  .netcard .big{
    font: 700 30px 'Poppins';
    color: #0F172A;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .netcard .big-lbl{ font-size: 12px; color: #64748B; margin-top: 2px; }

  .pay-details{
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #E2E8F0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
  }
  .pay-details .k{ font-size: 11px; color: #94A3B8; line-height: 1.2; }
  .pay-details .v{ font-size: 12px; font-weight: 600; color: #0F172A; line-height: 1.3; }
  .pay-details .full{ grid-column: 1 / -1; }

  .ghost-link{
    background: transparent; border: 0;
    color: #BD1313;
    font: 600 12px 'Poppins';
    cursor: pointer;
    padding: 0;
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ghost-link:hover{ color: #991010; }

  /* DOCUMENT CARDS */
  .doc-list{ display: flex; flex-direction: column; gap: 12px; }
  .doc-card{
    background: white;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    overflow: hidden;
    animation: staggerUp 400ms cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes staggerUp{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .dc-head{
    height: 44px;
    background: #0F172A;
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    color: white;
  }
  .dc-head .l{ display: flex; align-items: center; gap: 12px; }
  .dc-head .tmpl{
    font: 600 11px 'JetBrains Mono';
    color: white;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .dc-head .type{ font-size: 12px; color: rgba(255,255,255,0.6); }
  .dc-head button.pv{
    background: none; border: 0;
    color: rgba(255,255,255,0.6);
    font: 500 12px 'Poppins';
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 150ms, background 150ms;
  }
  .dc-head button.pv:hover{ color: white; background: rgba(255,255,255,0.06); }

  .dc-body{
    position: relative;
    padding: 20px 22px 32px;
    font-size: 12px;
    color: #0F172A;
    line-height: 1.8;
    max-height: 220px;
    overflow: hidden;
  }
  .dc-body::after{
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,1));
    pointer-events: none;
  }
  .dc-body p{ margin: 0 0 8px; }
  .dc-body .blk{ margin-bottom: 12px; }
  .vr{
    background: #FEF3C7;
    color: #D97706;
    border-radius: 4px;
    padding: 1px 6px;
    font-weight: 600;
  }

  /* doc 4 — settlement table */
  .doc4-table{
    width: 100%; border-collapse: collapse;
    font-size: 12px; margin-top: 6px;
  }
  .doc4-table th, .doc4-table td{
    border-bottom: 1px solid #F1F5F9;
    padding: 6px 8px;
    text-align: left;
  }
  .doc4-table th{ color: #94A3B8; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
  .doc4-table td.r{ text-align: right; font-variant-numeric: tabular-nums; }

  .dc-foot{
    height: 40px;
    background: #F8FAFC;
    border-top: 1px solid #E2E8F0;
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .dc-foot .lbl{ font-size: 12px; color: #94A3B8; }
  .dc-foot .right{ display: flex; gap: 12px; }
  .dc-foot .right button{
    background: transparent; border: 0;
    color: #BD1313;
    font: 600 12px 'Poppins';
    cursor: pointer;
    padding: 0;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .dc-foot .right button:hover{ color: #991010; }

  /* APPROVE & DISPATCH */
  .approve{
    margin-top: 32px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 16px;
    padding: 24px;
  }
  .approve h3{ margin: 0; font: 600 16px 'Poppins'; color: #0F172A; }
  .approve .sub{ font-size: 13px; color: #64748B; margin-top: 6px; line-height: 1.5; }

  .check-list{
    margin-top: 18px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .check-list .ln{
    display: flex; align-items: center;
    font-size: 13px;
    color: #0F172A;
  }
  .check-list .ln .ico{
    width: 18px; height: 18px; border-radius: 50%;
    background: #DCFCE7; color: #16A34A;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-right: 10px;
  }
  .check-list .ln .txt{ flex: 1; }

  .email-prev{
    margin-top: 18px;
    background: white;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    padding: 16px;
  }
  .email-prev .lbl{ font: 600 10px 'Poppins'; text-transform: uppercase; color: #94A3B8; letter-spacing: 0.5px; margin-bottom: 8px; }
  .email-prev .name{ font-size: 13px; font-weight: 600; color: #0F172A; }
  .email-prev .email{ font-size: 12px; color: #BD1313; margin-top: 2px; }
  .email-prev .subj{ font-size: 12px; font-weight: 600; color: #475569; margin-top: 10px; }
  .email-prev .body{ font-size: 12px; color: #64748B; margin-top: 4px; line-height: 1.5; }

  .danger-info{
    margin-top: 16px;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: 10px;
    padding: 12px 16px;
    display: flex; gap: 10px; align-items: flex-start;
    color: #DC2626;
    font-size: 13px; line-height: 1.5;
  }
  .danger-info svg{ color: #DC2626; flex-shrink: 0; margin-top: 1px; }

  .dispatch-row{ margin-top: 20px; display: flex; gap: 10px; }
  .btn{
    height: 48px; padding: 0 18px;
    border-radius: 10px;
    font: 600 14px 'Poppins';
    border: 1.5px solid transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 200ms;
  }
  .btn-secondary{ background: white; border-color: #E2E8F0; color: #475569; }
  .btn-secondary:hover{ background:#F8FAFC; border-color: #CBD5E1; }
  .btn-danger{
    background: #BD1313; color: white; border: 0;
    box-shadow: 0 4px 12px rgba(189,19,19,0.30);
  }
  .btn-danger:hover{ background:#991010; transform: translateY(-1px); }
  .dispatch-row .save{ flex: 1; }
  .dispatch-row .go{ flex: 2; }

  /* MODAL (common) */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 200ms;
  }
  .modal{
    background: white;
    border-radius: 20px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.28);
    max-height: calc(100vh - 40px);
    overflow: hidden;
    animation: scaleIn 300ms cubic-bezier(.2,.9,.2,1);
    display: flex; flex-direction: column;
  }
  /* Doc preview modal */
  .doc-modal{ width: 640px; max-width: 100%; }
  .dm-head{
    flex-shrink: 0;
    height: 56px;
    padding: 0 24px;
    border-bottom: 1px solid #E2E8F0;
    display: flex; align-items: center; justify-content: space-between;
    background: white;
  }
  .dm-head .t{ font-size: 14px; font-weight: 600; color: #0F172A; }
  .dm-head .r{ display: flex; gap: 10px; align-items: center; }
  .dm-head .dl{
    background: transparent; border: 0;
    color: #BD1313;
    font: 600 12px 'Poppins';
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .dm-head .dl:hover{ background: #FDF2F2; }
  .dm-head .x{
    background: transparent; border: 0;
    width: 32px; height: 32px;
    border-radius: 8px;
    color: #94A3B8;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dm-head .x:hover{ background: #F1F5F9; color: #0F172A; }

  .dm-body{
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px 40px;
    background: white;
    font-size: 13px;
    color: #0F172A;
    line-height: 1.8;
  }
  .dm-body .letter-head{
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid #E2E8F0;
  }
  .dm-body .letter-head img{ height: 36px; }
  .dm-body .letter-head .co{ font: 700 14px 'Poppins'; color: #0F172A; }
  .dm-body .letter-head .addr{ font-size: 11px; color: #94A3B8; margin-top: 2px; }
  .dm-body .date-line{ margin-top: 18px; color: #64748B; font-size: 12px; }
  .dm-body p{ margin: 0 0 12px; }
  .dm-body .sig{
    margin-top: 32px; display: flex; flex-direction: column; gap: 2px;
  }
  .dm-body .sig .line{
    width: 160px; height: 1px;
    border-bottom: 1px solid #0F172A;
    margin-bottom: 8px;
  }
  .dm-body .sig .nm{ font: 600 14px 'Poppins'; color: #0F172A; }
  .dm-body .sig .ro{ font-size: 12px; color: #64748B; }
  .dm-body .sig .co{ font-size: 12px; color: #94A3B8; }

  /* Dispatch confirm modal */
  .conf-modal{ width: 480px; max-width: 100%; padding: 32px; text-align: center; display: block; }
  .conf-modal h2{ margin: 0; font: 600 18px 'Poppins'; color: #0F172A; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .conf-modal .desc{ font-size: 13px; color: #64748B; margin-top: 8px; line-height: 1.5; }
  .conf-modal .bullets{
    margin-top: 14px; padding: 0;
    list-style: none;
    text-align: left;
  }
  .conf-modal .bullets li{
    position: relative;
    padding: 6px 0 6px 18px;
    font-size: 13px;
    color: #475569;
    line-height: 1.5;
  }
  .conf-modal .bullets li::before{
    content: "•";
    position: absolute;
    left: 4px; top: 6px;
    color: #DC2626; font-weight: 700;
  }
  .conf-modal .fld{ margin-top: 18px; text-align: left; }
  .conf-modal .fld .lbl{
    font: 600 11px 'Poppins'; text-transform: uppercase;
    color: #94A3B8; letter-spacing: 0.6px; margin-bottom: 8px;
  }
  .conf-modal .inp{
    width: 100%; height: 48px;
    border: 1.5px solid #E2E8F0;
    border-radius: 10px;
    background: white;
    padding: 0 14px;
    font: 600 14px 'JetBrains Mono';
    letter-spacing: 0.5px;
    color: #0F172A;
    outline: none;
    transition: all 180ms;
    text-align: center;
  }
  .conf-modal .inp::placeholder{ color:#CBD5E1; font-weight: 500; letter-spacing: 1px; }
  .conf-modal .inp:focus{ border-color:#BD1313; box-shadow: 0 0 0 3px rgba(189,19,19,0.10); }
  .conf-modal .inp.ok{ border-color: #16A34A; color: #16A34A; }

  .conf-modal .row{ margin-top: 20px; display: flex; gap: 10px; }
  .conf-modal .row .btn{ height: 44px; flex: 1; font-size: 13px; }

/* STEPPER */
function Stepper(){
  const steps = [
    { label: 'Initiation', state: 'done' },
    { label: 'Clearance',  state: 'done' },
    { label: 'Settlement', state: 'active' },
    { label: 'Dispatch',   state: 'upcoming' },
    { label: 'Completed',  state: 'upcoming' },
  ];
  return (
    <div className="stepper">
      {steps.map((s, i) => (
        <React.Fragment key={s.label}>
          <div className={'step ' + s.state}>
            <div className="circle">
              {s.state === 'done' ? <Ic.checkBold /> : i + 1}
            </div>
            <div className="lbl">{s.label}</div>
          </div>
          {i < steps.length - 1 && (
            <div className={'connector ' + (steps[i].state === 'done' ? 'done' : '')} />
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

                          <td style={{ textAlign:'right' }}>₹2,96,538</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="fin-block">
                  <div className="fin-title">Deductions</div>
                  <div className="fin-table">
                    <table className="amt">
                      <thead>
                        <tr><th>Item</th><th>Reason</th><th className="r">Amount</th></tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td className="item">Loan Recovery</td>
                          <td className="calc">Outstanding balance</td>
                          <td className="amount">₹15,000</td>
                        </tr>
                        <tr>
                          <td className="item">Notice Period Buy-out</td>
                          <td className="calc">Waived</td>
                          <td className="amount muted">₹0</td>
                        </tr>
                        <tr>
                          <td className="item">Other Deductions</td>
                          <td className="calc">Miscellaneous</td>
                          <td className="amount">₹2,500</td>
                        </tr>
                        <tr className="sub ded">
                          <td>Total Deductions</td>
                          <td></td>
                          <td style={{ textAlign:'right' }}>₹17,500</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

              {/* NET PAYABLE */}
              <div>
                <div className="netcard">
                  <h4>Net Payable</h4>
                  <div className="row">
                    <span className="k">Gross Earnings</span>
                    <span className="v green">₹2,96,538</span>
                  </div>
                  <div className="row">
                    <span className="k">Total Deductions</span>
                    <span className="v red">−₹17,500</span>
                  </div>
                  <div className="nd" />
                  <div className="big">₹2,79,038</div>
                  <div className="big-lbl">Net F&amp;F Payable</div>

                  <div className="pay-details">
                    <div>
                      <div className="k">Payment Mode</div>
                      <div className="v">Bank Transfer (NEFT)</div>
                    </div>
                    <div>
                      <div className="k">Payment Date</div>
                      <div className="v">June 10, 2025</div>
                    </div>
                    <div className="full">
                      <div className="k">Bank Account</div>
                      <div className="v mono">XXXX XXXX 4521</div>
                    </div>
                    <div className="full">
                      <div className="k">Bank</div>
                      <div className="v">HDFC Bank · <span className="mono">HDFC0001234</span></div>
                    </div>
                  </div>

                  <button className="ghost-link" onClick={()=>showToast('Edit mode coming soon')}>
                    Edit Settlement →
                  </button>
                </div>
              </div>
            </div>

            <div className="divider" />

            {/* DOCUMENTS */}
            <div className="sec-label">Documents to Dispatch</div>
            <div style={{ fontSize: 13, color:'#64748B', marginTop:'-6px', marginBottom: 16 }}>
              Review each document before final dispatch:
            </div>

            <div className="doc-list">
              {docs.map((d, i) => (
                <div key={d.id} className="doc-card" style={{ animationDelay: `${i * 60}ms` }}>
                  <div className="dc-head">
                    <div className="l">
                      <span className="tmpl">{d.id}</span>
                      <span className="type">{d.type}</span>
                    </div>
                    <button className="pv" onClick={()=>setPreviewDoc(d)}>
                      <Ic.eye /> Preview
                    </button>
                  </div>
                  <div className="dc-body">
                    {d.preview}
                  </div>
                  <div className="dc-foot">
                    <div className="lbl">Full document</div>
                    <div className="right">
                      <button onClick={()=>setPreviewDoc(d)}>Preview <Ic.arrow /></button>
                      <button onClick={()=>showToast(`Downloaded ${d.id}.pdf`)}>Download <Ic.download /></button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* APPROVE & DISPATCH */}
            <div className="approve">
              <h3>Approve &amp; Dispatch</h3>
              <div className="sub">Once approved, all documents will be dispatched to Priya Malhotra via email and the employee record will be marked as Terminated.</div>

              <div className="check-list">
                <div className="ln"><span className="ico"><Ic.check /></span><span className="txt">All departments cleared</span></div>
                <div className="ln"><span className="ico"><Ic.check /></span><span className="txt">F&amp;F settlement calculated — <strong style={{ fontWeight: 600 }}>₹2,79,038 net payable</strong></span></div>
                <div className="ln"><span className="ico"><Ic.check /></span><span className="txt">4 documents ready for dispatch</span></div>
                <div className="ln"><span className="ico"><Ic.check /></span><span className="txt">Payment scheduled for June 10, 2025</span></div>
              </div>

              <div className="email-prev">
                <div className="lbl">Email will be sent to</div>
                <div className="name">Priya Malhotra</div>
                <div className="email">priya.malhotra@gmail.com</div>
                <div className="subj">Subject: Your Relieving &amp; F&amp;F Documents — AIVision21</div>
                <div className="body">Dear Priya, Please find attached your official documents from AIVision21 covering acceptance of resignation, relieving, experience certification, and the full &amp; final settlement statement…</div>
              </div>

              <div className="danger-info">
                <Ic.warn />
                <div>This action is <strong>irreversible</strong>. The employee record will be permanently marked as Terminated upon dispatch.</div>
              </div>

              <div className="dispatch-row">
                <button className="btn btn-secondary save" onClick={()=>showToast('Saved. You can return to this case from the dashboard.')}>
                  Save &amp; Review Later
                </button>
                <button className="btn btn-danger go" onClick={()=>setShowDispatch(true)}>
                  <Ic.send /> Approve &amp; Dispatch
                </button>
              </div>
            </div>
          </div>

          {/* FOOTER */}
          <div className="foot">
            <button className="foot-ghost" onClick={()=> location.href='Clearance Tracker.html'}>
              <Ic.back /> Back to Clearance
            </button>
            <div style={{ fontSize: 12, color: '#94A3B8' }}>
              Case <span className="mono">AIV-2024-0089</span> · Phase 3 Settlement
            </div>
          </div>
        </div>
      </div>

      {previewDoc && <DocPreviewModal doc={previewDoc} onClose={()=>setPreviewDoc(null)} />}
      {showDispatch && (
        <DispatchModal
          onClose={()=>setShowDispatch(false)}
          onDone={()=>{ setShowDispatch(false); showToast('Navigating to audit log…'); }}
        />
      )}

      {toast && (
        <div className="toast"><Ic.check style={{ color:'#86EFAC' }} /> {toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
