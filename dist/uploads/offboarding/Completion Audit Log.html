<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>Completion Audit Log · AIVision HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; min-height: 100%; }
  body{
    font-family: 'Poppins', system-ui, sans-serif;
    color: #0F172A;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* SHELL */
  .shell{
    position: relative;
    min-height: 100vh;
    background: linear-gradient(145deg, #0F172A 0%, #1E293B 55%, #2D1010 100%);
    overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
    animation: screenEnter 300ms ease both;
  }
  @keyframes screenEnter{
    from{ opacity: 0; transform: translateY(4px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .shell::before{
    content:""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none; z-index: 0;
  }
  .shell::after{
    content:""; position: absolute;
    top: -120px; right: -120px;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: rgba(189,19,19,0.06);
    pointer-events: none; z-index: 0;
  }
  .deco-glow{
    position:absolute; left:-140px; bottom:-180px;
    width: 460px; height: 460px; border-radius:50%;
    background: radial-gradient(circle, rgba(189,19,19,0.10), transparent 60%);
    pointer-events: none; z-index:0;
  }

  /* TOP NAV */
  .topnav{
    position: sticky; top: 0; z-index: 20;
    width: 100%; height: 56px;
    background: rgba(15,23,42,0.55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-left{ display: flex; align-items: center; gap: 14px; }
  .nav-left img{ height: 28px; display: block; }
  .nav-left .divider{ width:1px; height:20px; background: rgba(255,255,255,0.12); }
  .nav-left .title{ font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); }
  .nav-left .crumb{ color: rgba(255,255,255,0.4); font-weight: 500; margin-left: 4px; }
  .nav-right{ display: flex; align-items: center; gap: 12px; }
  .nav-right .who{ text-align: right; line-height: 1.15; }
  .nav-right .name{ font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); }
  .nav-right .role{ font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .av-rk{
    width: 34px; height: 34px; border-radius: 50%;
    background: #BD1313; color: white;
    display: flex; align-items: center; justify-content: center;
    font: 600 12px 'Poppins';
  }

  /* CARD */
  .card-wrap{
    position: relative; z-index: 1;
    width: 100%;
    display: flex; justify-content: center;
    padding: 32px 20px 56px;
  }
  .card{
    width: 100%; max-width: 780px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    overflow: hidden;
    animation: scaleIn 350ms cubic-bezier(.2,.9,.2,1) both;
  }
  .card-top{
    height: 56px;
    padding: 0 32px;
    border-bottom: 1px solid #E2E8F0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-top .l{ display: flex; align-items: center; gap: 12px; }
  .card-top .l img{ height: 24px; display: block; }
  .card-top .l .t{ font-size: 13px; font-weight: 600; color: #0F172A; }
  .card-top .r{ display: flex; align-items: center; gap: 8px; }
  .card-top .r .lbl{ font-size: 12px; color: #94A3B8; }
  .card-top .r .em{ font-size: 12px; font-weight: 600; color: #BD1313; }

  /* STEPPER */
  .stepper{
    padding: 18px 32px;
    display: flex; align-items: flex-start;
    background: white;
  }
  .step{
    display: flex; flex-direction: column; align-items: center;
    flex: 0 0 auto; width: 110px; position: relative;
  }
  .step .circle{
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #DCFCE7; color: #16A34A; border: 1px solid #86EFAC;
  }
  .step .lbl{
    margin-top: 8px;
    font: 600 11px 'Poppins';
    color: #16A34A;
    text-align: center; line-height: 1.2;
  }
  .connector{
    flex: 1; height: 2px;
    background: #86EFAC;
    margin-top: 15px;
    border-radius: 2px;
    min-width: 12px;
  }

  /* COMPLETION BANNER */
  .complete-banner{
    background: #DCFCE7;
    border-top: 1px solid #86EFAC;
    border-bottom: 1px solid #86EFAC;
    padding: 12px 32px;
    display: flex; align-items: center; gap: 8px;
    color: #15803D;
    font: 600 13px 'Poppins';
    animation: fadeDown 400ms cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes fadeDown{
    from{ opacity: 0; transform: translateY(-8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* MASTER RECORD BANNER */
  .mr-banner{
    padding: 20px 32px;
    border-bottom: 1px solid #E2E8F0;
    background: linear-gradient(135deg, #F8FAFC 0%, #FDF2F2 100%);
  }
  .mr-top{ display: flex; align-items: center; gap: 16px; }
  .mr-avatar{
    width: 48px; height: 48px; border-radius: 50%;
    background: #BD1313; color: white;
    font: 600 15px 'Poppins';
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mr-info{ flex: 1; min-width: 0; }
  .mr-name{ font: 700 16px 'Poppins'; color: #0F172A; line-height: 1.2; }
  .mr-desig{ font-size: 12px; color: #64748B; margin-top: 2px; }
  .mr-id{ font-size: 11px; color: #94A3B8; margin-top: 2px; }

  .mr-chips{
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    flex-shrink: 0;
  }
  .pill{
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    font: 600 11px 'Poppins';
    white-space: nowrap;
  }
  .pill-stack{
    display: inline-flex; align-items: center;
    background: white;
    border: 1px solid #E2E8F0;
    border-radius: 999px;
    padding: 4px 12px 4px 10px;
    gap: 6px;
  }
  .pill-stack .k{ font-size: 10px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.4px; }
  .pill-stack .v{ font-size: 11px; font-weight: 600; color: #0F172A; }

  .mr-summary-chips{
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 14px;
  }
  .sum-chip{
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid;
    font-size: 11px;
    font-weight: 500;
  }

  /* QUICK STATS */
  .stats{
    padding: 16px 32px;
    border-bottom: 1px solid #E2E8F0;
    background: #FAFAFA;
    display: flex; gap: 32px;
    flex-wrap: wrap;
  }
  .stat .lbl{ font-size: 11px; color: #94A3B8; line-height: 1.2; }
  .stat .val{ font-size: 13px; font-weight: 600; color: #0F172A; margin-top: 2px; }
  .stat .val.red{ color: #BD1313; }

  /* ACTION BAR */
  .actionbar{
    padding: 16px 28px;
    border-bottom: 1px solid #E2E8F0;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .filters{ display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filt{
    height: 30px;
    padding: 0 14px;
    border-radius: 999px;
    background: white;
    border: 1px solid #E2E8F0;
    color: #64748B;
    font: 600 12px 'Poppins';
    cursor: pointer;
    transition: all 150ms;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .filt:hover{ border-color: #F5BFBF; color: #BD1313; }
  .filt.active{
    background: #BD1313;
    border-color: #BD1313;
    color: white;
    box-shadow: 0 2px 8px rgba(189,19,19,0.25);
  }
  .filt .count{
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 0 6px;
    font-size: 10px;
    font-weight: 700;
  }
  .filt:not(.active) .count{ background: #F1F5F9; color: #94A3B8; }

  .actionbar .spacer{ flex: 1; }
  .pdf-btn{
    height: 36px; padding: 0 14px;
    border: 1.5px solid #E2E8F0;
    background: white;
    color: #475569;
    border-radius: 8px;
    font: 600 12px 'Poppins';
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 180ms;
  }
  .pdf-btn:hover{ background: #F8FAFC; border-color: #CBD5E1; }
  .ghost-link{
    background: transparent; border: 0;
    color: #BD1313;
    font: 500 12px 'Poppins';
    cursor: pointer;
    padding: 6px 4px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ghost-link:hover{ color: #991010; }

  /* AUDIT TIMELINE */
  .timeline{
    background: white;
  }
  .entry{
    padding: 20px 32px;
    border-bottom: 1px solid #E2E8F0;
    display: flex; gap: 20px;
    transition: background 150ms;
    animation: staggerUp 450ms cubic-bezier(.2,.9,.2,1) both;
  }
  .entry:last-child{ border-bottom: 0; }
  .entry:hover{ background: #F8FAFC; }
  @keyframes staggerUp{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes fade150{
    from{ opacity: 0; transform: translateY(4px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .e-left{
    flex: 0 0 24px;
    position: relative;
    display: flex; justify-content: center;
  }
  .e-bar{
    position: absolute;
    top: 6px; bottom: -20px;
    left: 50%;
    width: 3px;
    margin-left: -1.5px;
    border-radius: 2px;
  }
  .entry:last-child .e-bar{ bottom: 8px; }
  .e-dot{
    position: relative;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-top: 6px;
    z-index: 1;
    box-shadow: 0 0 0 3px white;
  }

  .e-date{
    flex: 0 0 90px;
    padding-top: 2px;
  }
  .e-date .d{ font-size: 12px; font-weight: 600; color: #0F172A; }
  .e-date .t{ font-size: 11px; color: #94A3B8; margin-top: 2px; }

  .e-content{ flex: 1; min-width: 0; }
  .e-top{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .e-source{ font: 500 11px 'JetBrains Mono'; color: #94A3B8; }
  .e-title{ font: 600 13px 'Poppins'; color: #0F172A; margin-top: 6px; }
  .e-note{ font-size: 13px; color: #64748B; margin-top: 4px; line-height: 1.5; }
  .e-by{ font-size: 12px; color: #94A3B8; margin-top: 8px; line-height: 20px; }
  .e-by .av{
    width: 20px; height: 20px;
    border-radius: 50%;
    color: white;
    font: 600 10px 'Poppins';
    display: inline-flex; align-items: center; justify-content: center;
    vertical-align: middle;
    margin-right: 6px;
  }

  /* CARD FOOTER */
  .foot{
    height: 64px;
    background: #FAFAFA;
    border-top: 1px solid #E2E8F0;
    padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .foot-ghost{
    background: transparent; border: 0;
    color: #BD1313; font: 500 13px 'Poppins';
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .foot-ghost:hover{ color: #991010; }
  .closed-pill{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    background: #DCFCE7;
    color: #16A34A;
    border: 1px solid #86EFAC;
    font: 600 13px 'Poppins';
  }

  /* MASTER RECORD MODAL */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 200ms ease both;
  }
  .modal{
    width: 600px; max-width: 100%;
    max-height: 85vh;
    background: white;
    border-radius: 20px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.28);
    overflow: hidden;
    animation: scaleIn 300ms cubic-bezier(.2,.9,.2,1) both;
    display: flex; flex-direction: column;
  }
  .mh{
    flex-shrink: 0;
    background: #0F172A;
    padding: 20px 28px;
    display: flex; align-items: center; justify-content: space-between;
    color: white;
  }
  .mh .t{ font: 600 16px 'Poppins'; }
  .mh .s{ font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .mh .x{
    background: transparent; border: 0;
    width: 32px; height: 32px;
    border-radius: 8px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .mh .x:hover{ background: rgba(255,255,255,0.08); color: white; }

  .mb{ flex: 1; overflow-y: auto; padding: 24px 28px; background: white; }
  .ms{ padding: 12px 0; }
  .ms + .ms{ border-top: 1px solid #E2E8F0; }
  .ms-label{
    font: 600 10px 'Poppins';
    text-transform: uppercase; color: #94A3B8;
    letter-spacing: 0.6px;
    margin-bottom: 12px;
  }
  .ms-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .ms-full{ grid-column: 1 / -1; }
  .ms-k{ font-size: 11px; color: #94A3B8; line-height: 1.2; }
  .ms-v{ font-size: 13px; font-weight: 600; color: #0F172A; margin-top: 2px; }

  .clr-row{
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
    font-size: 13px;
  }
  .clr-row + .clr-row{ border-top: 1px dashed #F1F5F9; }
  .clr-row .nm{ font-weight: 600; color: #0F172A; }
  .clr-row .meta{ color: #64748B; font-size: 12px; }
  .clr-row .badge{ color: #16A34A; font: 600 11px 'Poppins'; }
  .clr-overall{
    margin-top: 10px;
    background: #DCFCE7;
    border: 1px solid #86EFAC;
    border-radius: 8px;
    padding: 10px 12px;
    color: #15803D;
    font: 600 12px 'Poppins';
    display: flex; align-items: center; gap: 6px;
  }

  .doc-row{
    display: flex; align-items: center;
    padding: 8px 0;
    font-size: 12px;
  }
  .doc-row + .doc-row{ border-top: 1px dashed #F1F5F9; }
  .doc-row .tmpl{
    font-family: 'JetBrains Mono';
    background: #F1F5F9;
    color: #475569;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 10px;
    flex-shrink: 0;
    font-size: 10px; font-weight: 600;
  }
  .doc-row .nm{ font-size: 13px; font-weight: 600; color: #0F172A; }
  .doc-row .dt{ color: #94A3B8; font-size: 11px; margin-left: auto; }

  .deliv{
    margin-top: 10px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: #475569;
    display: flex; align-items: center; gap: 6px;
  }
  .deliv strong{ color: #BD1313; }

  .mf{
    flex-shrink: 0;
    background: #FAFAFA;
    border-top: 1px solid #E2E8F0;
    padding: 16px 28px;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .btn{
    height: 44px; padding: 0 18px;
    border-radius: 10px;
    font: 600 13px 'Poppins';
    border: 1.5px solid transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 200ms;
  }
  .btn-secondary{ background: white; border-color: #E2E8F0; color: #475569; }
  .btn-secondary:hover{ background: #F8FAFC; border-color: #CBD5E1; }
  .btn-primary{
    background: #BD1313; color: white; border: 0;
    box-shadow: 0 4px 12px rgba(189,19,19,0.30);
  }
  .btn-primary:hover{ background:#991010; transform: translateY(-1px); }

  /* TOAST */
  .toast{
    position: fixed; left: 50%; bottom: 32px;
    transform: translateX(-50%);
    background: #0F172A; color: white;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 18px;
    font: 500 13px 'Poppins';
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    display: flex; align-items: center; gap: 10px;
    z-index: 200;
  }

  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes scaleIn{
    from{ opacity:0; transform: scale(.94) translateY(8px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const Ic = {
  check: (p) => <svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  checkBold: (p) => <svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  download: (p) => <svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
  back: (p) => <svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
  x: (p) => <svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
};

const STEPS = ['Initiation','Clearance','Settlement','Dispatch','Completed'];

function Stepper(){
  return (
    <div className="stepper">
      {STEPS.map((s, i) => (
        <React.Fragment key={s}>
          <div className="step">
            <div className="circle"><Ic.checkBold /></div>
            <div className="lbl">{s}</div>
          </div>
          {i < STEPS.length - 1 && <div className="connector" />}
        </React.Fragment>
      ))}
    </div>
  );
}

/* AUDIT ENTRIES */
const ENTRIES = [
  { id: 1, date: 'Apr 28', time: '11:32 AM', type: 'hr',     source: 'HR Manager',    sourceMono: 'HR_MANAGER',
    title: 'Exit Initiated',
    note: 'Resignation received from Priya Malhotra. Exit process formally initiated.',
    by: 'Ravi Kumar', role: 'HR Manager', avatar: 'RK', avatarBg: '#BD1313' },
  { id: 2, date: 'Apr 28', time: '11:35 AM', type: 'system', source: 'System (Auto)', sourceMono: 'SYS_AUTO',
    title: 'Department Notifications Dispatched',
    note: 'Auto-notifications sent to: IT & Systems, Accounts, Admin, Project Manager, and Reporting Manager.',
    by: 'System (Auto)', role: 'Automated', avatar: 'SY', avatarBg: '#2563EB' },
  { id: 3, date: 'Apr 30', time: '09:15 AM', type: 'dept',   source: 'IT & Systems',  sourceMono: 'IT_SYSTEMS',
    title: 'IT & Systems Clearance Completed',
    note: 'All 5 IT items cleared. Laptop returned, access revoked, data backup completed.',
    by: 'Suresh', role: 'IT Admin', avatar: 'SU', avatarBg: '#0369A1' },
  { id: 4, date: 'Apr 30', time: '02:30 PM', type: 'dept',   source: 'Admin',         sourceMono: 'ADMIN_TEAM',
