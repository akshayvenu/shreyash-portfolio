<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesVision — Director Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111827;background:#F7F8FA;-webkit-font-smoothing:antialiased;}
  #root{height:100%;}
  button,input,select,textarea{font-family:inherit;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .badge-pulse{animation:badgePulse 1.2s ease-out;}
  @keyframes badgePulse{0%{transform:scale(1);}40%{transform:scale(1.9);}100%{transform:scale(1);}}
  #sv-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#F7F8FA;font-size:13px;color:#6B7280;letter-spacing:0.04em;text-transform:uppercase;z-index:9999;}
  #sv-boot span{display:block;width:26px;height:26px;border:2.5px solid #E5E7EB;border-top-color:#5E72E4;border-radius:50%;animation:svSpin 0.8s linear infinite;}
  @keyframes svSpin{to{transform:rotate(360deg);}}
  #sv-toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:10000;pointer-events:none;}
  .sv-toast{background:#fff;color:#111827;font-size:13px;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,0.14),0 0 0 1px rgba(16,24,40,0.06);animation:svToastIn 220ms cubic-bezier(.2,.8,.3,1);max-width:340px;}
  @keyframes svToastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
</style>
</head><body>
<div id="sv-boot"><span></span>Loading Director Portal</div>
<div id="root"></div>
<div id="sv-toasts"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script>
  window.__sonner = {
    Toaster: function () { return null; },
    toast: function (msg, opts) {
      var host = document.getElementById('sv-toasts');
      if (!host) return;
      var el = document.createElement('div');
      el.className = 'sv-toast';
      el.textContent = String(msg);
      host.appendChild(el);
      setTimeout(function () {
        el.style.transition = 'opacity 180ms ease, transform 180ms ease';
        el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
        setTimeout(function () { el.remove(); }, 200);
      }, (opts && opts.duration) || 3000);
    }
  };
  window.addEventListener('DOMContentLoaded', function () {
    var check = setInterval(function () {
      var root = document.getElementById('root');
      if (root && root.childNodes.length) {
        clearInterval(check);
        var boot = document.getElementById('sv-boot');
        if (boot) boot.remove();
      }
    }, 120);
  });
</script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script>
  (async function () {
    try {
      const src = await (await fetch('salesvision-app.tsx')).text();
      const { code } = Babel.transform(src, { presets: ['typescript', 'react'], filename: 'app.tsx' });
      (0, eval)(code);
    } catch (e) {
      console.error(e);
      const boot = document.getElementById('sv-boot');
      if (boot) boot.textContent = 'Failed to load prototype: ' + e.message;
    }
  })();
</script>
</body></html>
